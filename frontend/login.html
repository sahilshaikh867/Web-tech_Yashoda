<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">

        <h1>Student Login</h1>


        <form id="loginForm">


            <label>Email</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter email"
            >


            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter password"
            >


            <button type="submit">

                Login

            </button>

        </form>


        <p id="loginMessage"></p>


        <p>

            New student?

            <a href="index.html">

                Register here

            </a>

        </p>

    </div>



    <script>


        // --------------------------------
        // GET FORM
        // --------------------------------

        const loginForm =
            document.getElementById("loginForm");


        // --------------------------------
        // GET MESSAGE AREA
        // --------------------------------

        const loginMessage =
            document.getElementById("loginMessage");



        // --------------------------------
        // LOGIN FORM SUBMIT
        // --------------------------------

        loginForm.addEventListener(
            "submit",
            function (event) {


                // Stop page refresh

                event.preventDefault();



                // --------------------------------
                // GET USER INPUT
                // --------------------------------

                const email =
                    document.getElementById(
                        "loginEmail"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "loginPassword"
                    ).value;



                // --------------------------------
                // EMAIL VALIDATION
                // --------------------------------

                if (email === "") {

                    loginMessage.style.color =
                        "red";

                    loginMessage.textContent =
                        "Please enter email.";

                    return;

                }



                // --------------------------------
                // PASSWORD VALIDATION
                // --------------------------------

                if (password === "") {

                    loginMessage.style.color =
                        "red";

                    loginMessage.textContent =
                        "Please enter password.";

                    return;

                }



                // --------------------------------
                // SEND DATA TO FLASK
                // --------------------------------

                fetch(
                    "http://127.0.0.1:5000/login",
                    {

                        method: "POST",


                        headers: {

                            "Content-Type":
                                "application/json"

                        },


                        body: JSON.stringify({

                            email: email,

                            password: password

                        })

                    }
                )


                // --------------------------------
                // GET RESPONSE
                // --------------------------------

                .then(function (response) {

                    return response.json();

                })


                // --------------------------------
                // PROCESS RESPONSE
                // --------------------------------

                .then(function (data) {


                    // LOGIN SUCCESS

                    if (data.success) {


                        loginMessage.style.color =
                            "green";


                        loginMessage.textContent =
                            data.message;



                        // Save student information

                        localStorage.setItem(
                            "student",
                            JSON.stringify(data.user)
                        );



                        // Open dashboard

                        setTimeout(function () {

                            window.location.href =
                                "dashboard.html";

                        }, 500);


                    }


                    // LOGIN FAILED

                    else {

                        loginMessage.style.color =
                            "red";


                        loginMessage.textContent =
                            data.message;

                    }

                })


                // --------------------------------
                // ERROR
                // --------------------------------

                .catch(function (error) {

                    console.log(error);


                    loginMessage.style.color =
                        "red";


                    loginMessage.textContent =
                        "Server connection failed.";

                });


            }
        );

    </script>


</body>

</html>
