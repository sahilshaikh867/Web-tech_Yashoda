<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Media</title>

    <link rel="stylesheet" href="css/media.css">

</head>


<body>

<header>

    <nav class="navbar">

        <h2>HTML <span>Media</span></h2>

        <div class="nav-links">

            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="elements.html">Elements</a>
            <a href="forms.html">Forms</a>
            <a href="lists.html">Lists</a>
            <a href="media.html">Media</a>

        </div>

    </nav>

</header>


<main>

    <h1>HTML Media 🎬</h1>

    <p>
        HTML can display images, audio and video.
    </p>


    <!-- Image -->

    <section class="media-card">

        <h2>🖼️ Image</h2>

        <img
            src="https://picsum.photos/700/350"
            alt="Sample landscape"
        >

        <p>
            The image element is used to display images.
        </p>

    </section>


    <!-- Audio -->

    <section class="media-card">

        <h2>🎵 Audio</h2>

        <audio controls>

            <source
                src="audio/song.mp3"
                type="audio/mpeg"
            >

            Your browser does not support audio.

        </audio>

    </section>


    <!-- Video -->

    <section class="media-card">

        <h2>🎬 Video</h2>

        <video controls width="100%">

            <source
                src="video/video.mp4"
                type="video/mp4"
            >

            Your browser does not support video.

        </video>

    </section>


</main>


<footer>

    <p>Images • Audio • Video — HTML Media</p>

</footer>

</body>
</html>
